<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的学习笔记</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <!-- 字体：Inter（英文数字）+ 思源黑体 Noto Sans SC（中文），按需分片加载 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.2.8/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.2.8/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.8/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.8/600.css">
  <!-- 网站设置：由管理后台「网站设置」修改 -->
  <script>
/* SITE_CONFIG_START */
window.SITE_CONFIG = {
  "title": "我的学习笔记",
  "themeColor": "#3b82f6",
  "searchPlaceholder": "搜索笔记…"
};
/* SITE_CONFIG_END */
  </script>
  <script>
    (function () {
      var c = window.SITE_CONFIG || {};
      var root = document.documentElement;
      if (c.title) document.title = c.title;
      var color = c.themeColor || '#3b82f6';
      root.style.setProperty('--theme-color', color);
      // 标签页小图标：和左上角 Logo 一样，颜色跟随主题色
      var fav = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='" + color + "'/>"
        + "<path d='M9.5 10.5h13M9.5 16h8' stroke='#fff' stroke-width='2.6' stroke-linecap='round'/>"
        + "<path d='M9.5 21.5l3 3 6.5-6.5' fill='none' stroke='#fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>";
      var link = document.createElement('link');
      link.rel = 'icon'; link.type = 'image/svg+xml';
      link.href = 'data:image/svg+xml,' + encodeURIComponent(fav);
      document.head.appendChild(link);
      // 明暗模式：优先用访客自己选的，否则跟随系统
      var saved = null;
      try { saved = localStorage.getItem('kb_theme'); } catch (e) {}
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      root.dataset.theme = saved || (mq.matches ? 'dark' : 'light');
      mq.addEventListener && mq.addEventListener('change', function (e) {
        var s = null;
        try { s = localStorage.getItem('kb_theme'); } catch (err) {}
        if (!s) root.dataset.theme = e.matches ? 'dark' : 'light';
      });
    })();
  </script>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="read-progress"></div>
  <button id="theme-toggle" type="button" aria-label="切换明暗模式" title="切换明暗模式">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <div id="app"></div>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('kb_theme', next); } catch (e) {}
    });
    (function () {
      var bar = document.getElementById('read-progress');
      function update() {
        var el = document.scrollingElement || document.documentElement;
        var max = el.scrollHeight - el.clientHeight;
        bar.style.width = (max > 40 ? Math.min(100, el.scrollTop / max * 100) : 0) + '%';
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('hashchange', function () { setTimeout(update, 300); });
    })();
    // 页面不存在（比如已被删除）时，换成友好的提示
    new MutationObserver(function () {
      var m = document.querySelector('.markdown-section');
      if (m && m.textContent.trim() === '404 - Not found') {
        m.innerHTML = '<div class="not-found"><div class="nf-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6M9.5 12.5l5 5M14.5 12.5l-5 5"/></svg></div>'
          + '<h1>这个页面不存在</h1><p>它可能已经被删除，或者网址输错了。</p>'
          + '<a class="nf-btn" href="#/">回到首页</a></div>';
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script>
    var site = window.SITE_CONFIG || {};
    window.$docsify = {
      // 固定的 Logo + 网站名称，后台不能修改
      name: '<svg class="site-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/>'
        + '<path d="M9.5 10.5h13M9.5 16h8"/><path d="M9.5 21.5l3 3 6.5-6.5"/></svg>'
        + '<span class="site-name">实践笔记</span>',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: false,
      // 每次都读取最新内容（GitHub Pages 默认让浏览器缓存 10 分钟）
      requestHeaders: { 'cache-control': 'max-age=0' },
      search: {
        placeholder: site.searchPlaceholder || '搜索…',
        noData: '没有找到相关内容',
        depth: 3,
        maxAge: 600000
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      plugins: [
        // 以 / 开头的图片按网站根目录解析（docsify 默认会拼到当前笔记所在文件夹）
        function (hook, vm) {
          var homeEmpty = false;
          hook.afterEach(function (html) {
            // 空页面显示空白，而不是 404
            // （翻页插件会先加一个空的容器，判断时去掉它）
            if (!html.replace(/<div class="docsify-pagination-container"><\/div>/g, '').replace(/\s/g, '')) {
              homeEmpty = vm.route.path === '/';
              return '<div class="empty-page"></div>' + html;
            }
            homeEmpty = false;
            return html.replace(/<img src="[^"]*" data-origin="(\/(?!\/)[^"]*)"/g, '<img src="$1" data-origin="$1"');
          });
          // 首页被删除（内容为空）时，自动打开左侧目录的第一篇
          hook.doneEach(function () {
            if (!homeEmpty) return;
            var tries = 0;
            (function go() {
              // 目录可能比正文晚加载，等它出现
              var first = document.querySelector('.sidebar-nav a[href^="#/"]:not([href="#/"])');
              if (first) { if (vm.route.path === '/') location.replace(first.getAttribute('href')); return; }
              if (++tries < 30) setTimeout(go, 100);
            })();
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
</body>
</html>
